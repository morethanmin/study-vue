
<script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>

<div id="example">
  <my-component></my-component>
</div>

<table>
  <my-row>...</my-row>
</table>

<!-- 다음과 같이 하면 my-row가 tr 엘리먼트라고 하더라도 에러가 발생한다. 
  이럴 때 is 라는 특수 속성을 이용하면 된다. -->

  <table>
    <tr is="my-row"></tr>
  </table>

  <!-- data 는 반드시 함수여야합니다1 -->
  <div id="example-2">
    <simple-counter></simple-counter>
    <simple-counter></simple-counter>
    <simple-counter></simple-counter>
  </div>

  <!-- data 는 반드시 함수여야합니다2 -->
  <div id="example-3">
    <simple-counter2></simple-counter2>
    <simple-counter2></simple-counter2>
    <simple-counter2></simple-counter2>
  </div>

  <!-- Props로 데이터 전달하기 -->
  <div id="example-4">
    <child message="안녕하세요!"></child>
  </div>

  <div id="example-5">
<!-- HTML는 kebab-case -->
  <child2 my-message="안녕하세요!"></child2>  
<!-- 동적 Props -->
  <div>
    <input v-model="parentMsg">
    <br>
    <child2 v-bind:my-message="parentMsg"></child2>
  </div>  
  </div>

  <todo-item v-bind="todo"></todo-item>

  <!-- 
    todo가 아래와같은 object일 때,
    todo: {
      text: 'Learn Vue',
      isComplete: false
    }
    해당 구문은 다음과같다.
    <todo-item
      v-bind:text="todo.text"
      v-bind:is-complete="todo.isComplete"
    ></todo-item>
   -->

<!-- v-on을 이용한 사용자 지정 이벤트 -->

<div id="counter-event-example">
  <p>{{ total }}</p>
  <button-counter v-on:increment="incrementTotal"></button-counter>
  <button-counter v-on:increment="incrementTotal"></button-counter>
</div>

<!-- 사용자 정의 이벤트를 사용하여 폼 입력 컴포넌트 만들기 -->


<!-- 
<input v-model="something">

  위 문장은 아래와 같다.
<input
  v-bind:value="something"
  v-on:input="something = $event.target.value">
  컴포넌트와 함께 사용하면 다음과같다
  <custom-input
  :value="something"
  @input="value => { something = value }">
</custom-input>
 -->

 <div id="example-6">
  <currency-input v-model="price"></currency-input>
 </div>

  <!-- 이름을 가지는 슬롯 -->

  <!-- 
    다음과 같은 템플릿을 가진 app-layout 컴포넌트가 있다고 가정해보자.
   -->
  <div class="container">
    <header>
      <slot name="header"></slot>
    </header>
    <main>
      <slot></slot>
    </main>
    <footer>
      <slot name="footer"></slot>
    </footer>
  </div>

  <!-- 
    해당 컴포넌트를 다음과같이 사용하면
   -->

   <app-layout>
    <h1 slot="header">여기에 페이지 제목이 위치합니다</h1>
  
    <p>메인 컨텐츠의 단락입니다.</p>
    <p>하나 더 있습니다.</p>
  
    <p slot="footer">여기에 연락처 정보입니다.</p>
  </app-layout>

  <!-- 
    아래와 같이 렌더링 된다.
   -->

   <div class="container">
    <header>
      <h1>여기에 페이지 제목이 위치합니다</h1>
    </header>
    <main>
      <p>메인 컨텐츠의 단락입니다.</p>
      <p>하나 더 있습니다.</p>
    </main>
    <footer>
      <p>여기에 연락처 정보입니다.</p>
    </footer>
  </div>

  <!-- 동적 컴포넌트 -->
<div id="example-7">
  <component v-bind:is="currentView">
    <!-- vm.currentView가 변경되면 컴포넌트가 변경됩니다! -->
  </component>
</div>
