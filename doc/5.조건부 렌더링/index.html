
<script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>

<!-- 조건부 렌더링 -->

<div id="app-11">
    <h1 v-if="awesome">Vue is awesome! {{message}}</h1>
    <h1 v-else>Oh no 😢</h1>
</div>


<!-- 
    v-if는 디렉티브기 때문에 하나의 엘리먼트에 추가해야합니다. 
    하지만 하나 이상의 엘리먼트를 트랜지션하려면 어떻게 해야할까요? 
    이 경우 우리는 보이지 않는 래퍼 역할을 하는 <template> 엘리먼트에 
    v-if를 사용할 수 있습니다. 최종 렌더링 결과에는 <template> 엘리먼트가 
    포함되지 않습니다.
 -->
<div id="app-12">
 <template  v-if="ok">
    <h1>Title</h1>
    <p>Paragraph 1</p>
    <p>Paragraph 2</p>
  </template>
</div>

<div id="app-13">
    <div v-if="Math.random() > 0.5">
        이제 나를 볼 수 있어요
    </div>
    <div v-else>
        이제는 안보입니다
    </div>
</div>

<!-- v-else-if또한 가능하다. -->


<div id="app-14">
    <template v-if="loginType === 'username'">
        <label>사용자 이름</label>
        <input placeholder="사용자 이름을 입력하세요">
      </template>
      <template v-else>
        <label>이메일</label>
        <input placeholder="이메일 주소를 입력하세요">
      </template>
      <div>
        <button v-on:click="changeType">로그인 유형 변경</button>
      </div>
      
</div>

<div id="app-15">
    <template v-if="loginType === 'username'">
        <label>사용자 이름</label>
        <input placeholder="사용자 이름을 입력하세요" key="username-input">
      </template>
      <template v-else>
        <label>이메일</label>
        <input placeholder="이메일 주소를 입력하세요" key="email-input">
      </template>
      <div>
        <button v-on:click="changeType">로그인 유형 변경</button>
      </div>
      
</div>
