
<script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>


<!-- 클래스와 스타일 바인딩 -->

<!-- v-bind를 사용할 때 객체도 사용가능하다. -->
<div v-bind:class="{ active: isActive }"></div>

<div
  class="static"
  v-bind:class="{ active: isActive, 'text-danger': hasError }"
></div>
<!-- 
data: {
  isActive: true,
  hasError: false
}
데이터가 다음과같을 때 위의 v-bind는 vue에 의해 
<div class="static active"></div>
와 같이 렌더링 된다.
-->

<div v-bind:class="classObject"></div>

<!-- 
data: {
  classObject: {
    active: true,
    'text-danger': false
  }
}
또는,
data: {
  isActive: true,
  error: null
},
computed: {
  classObject: function () {
    return {
      active: this.isActive && !this.error,
      'text-danger': this.error && this.error.type === 'fatal'
    }
  }
}
다음과 같이 데이터를 인라인으로 보내지 않고 계산된 속승으로도 렌더링 할 수 있다.

배열로도 보낼 수 있고, 삼항 연산자도 사용이 가능하다.
 -->

 <my-component class="baz boo"></my-component>

<!-- 
    해당 컴포넌트는 다음과같이 렌더링 된다.
    해당 컴포넌트의 루트 엘리먼트에 클래스가 추가되어있기 때문이다. 
<p class="foo bar baz boo">Hi</p>
-->

<div v-bind:style="{ color: activeColor, fontSize: fontSize + 'px' }"></div>

<!-- 
v-bind:style의 객체 구문은 javascript라는걸 명심해야한다. 그렇기때문에 camelCase로 표현해주어야한다.
 -->

 <div v-bind:style="styleObject"></div>

<!-- 
    다음과같이 스타일 객체를 직접 바인딩해 간결하게 사용하는것이 좋다.
 -->

 <div v-bind:style="[baseStyles, overridingStyles]"></div>

 <!-- 
     배열구문을 사용하여 여러개의 스타일 객체를 사용할수도 있다.
  -->
